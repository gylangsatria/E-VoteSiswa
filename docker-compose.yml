services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evotesiswa-web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - DB_HOST=db
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-rootpassword}
      - DB_NAME=${DB_NAME:-db_pilketos}
      - SESS_SAVE_PATH=/tmp/sessions
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8080}
      - APP_TIMEZONE=${APP_TIMEZONE:-Asia/Jakarta}
      - CI_ENV=${CI_ENV:-production}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - evotesiswa-network

  db:
    image: mysql:8.0
    container_name: evotesiswa-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-db_pilketos}
    volumes:
      - db_data:/var/lib/mysql
      - ./db_evotesiswa.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - evotesiswa-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: evotesiswa-phpmyadmin
    profiles:
      - tools
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD:-rootpassword}
      UPLOAD_LIMIT: 100M
    depends_on:
      - db
    networks:
      - evotesiswa-network

networks:
  evotesiswa-network:
    driver: bridge

volumes:
  db_data:
